# Label taxonomy — the single source of truth for this repository's labels.
#
# Governance (no ad-hoc labels):
#   - Every label this repo uses is declared here with a color and description.
#     Add or change a label by PR-ing this file; the `label-sync` workflow
#     applies the manifest when it lands on main (or via manual dispatch).
#   - `.github/labeler.yml` (the path-based PR labeler) may only reference
#     labels declared here — actions/labeler does not create labels.
#   - Sync is non-destructive (skip-delete): labels absent from this manifest
#     are left untouched. Retire a label by removing it here AND deleting it in
#     repo settings in the same change, so manifest and reality stay aligned.
#
# Taxonomy:
#   type        bug / enhancement / documentation / dependencies
#   area        metadata / backend / ci/cd / configuration
#   priority    prio:p0 — blocking the current release goal
#               prio:p1 — next in line once P0s clear
#               prio:p2 — triaged backlog, no near-term schedule
#   provenance  upstream:objectstack — blocked on / caused by the platform
#   workflow    needs-user-decision / skip-changeset
#   pm state    pm:queue / pm:dispatched / pm:blocked / pm:on-hold /
#               pm:awaiting-maintainer / pm:blocking / pm:epic / pm:retriage / pm:seat
#   triage      duplicate / invalid / question / wontfix /
#               good first issue / help wanted
#   routing     docs / i18n / testing / ui / upstream
#   lifecycle   finding / stale / post-preview / preview-1

# --- type ---
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: dependencies
  color: "0366d6"
  description: Dependency bumps and lockfile changes

# --- area (mirrors .github/labeler.yml path rules) ---
- name: metadata
  color: "c5def5"
  description: Declarative metadata — schema, security posture, UI surfaces
- name: backend
  color: "c2e0c6"
  description: Server-side behaviour — hooks, flows, actions
- name: ci/cd
  color: "6e5494"
  description: CI plumbing and the verification pipeline
- name: configuration
  color: "bfd4f2"
  description: Build and app configuration files

# --- priority ---
- name: "prio:p0"
  color: "b60205"
  description: Blocking the current release goal — do first
- name: "prio:p1"
  color: "d93f0b"
  description: Next in line once P0s clear
- name: "prio:p2"
  color: "fef2c0"
  description: Triaged backlog — no near-term schedule

# --- provenance ---
- name: "upstream:objectstack"
  color: "5319e7"
  description: Blocked on / caused by the ObjectStack platform — tracked upstream

# --- workflow ---
- name: needs-user-decision
  color: "fbca04"
  description: Needs the maintainer's call before work proceeds
- name: "pm:queue"
  color: "0e8a16"
  description: Ready for the PM dispatch loop
- name: "pm:dispatched"
  color: "1d76db"
  description: Dispatched to a dev agent by /pm-dispatch
- name: skip-changeset
  color: "cccccc"
  description: PR ships nothing to users (pure CI/docs chore) — changeset gate waived

# ---------------------------------------------------------------------------
# Inventory catch-up (#1501). The 22 entries below already existed as live
# label objects but were undeclared, so `skip-delete: true` was the only thing
# keeping them alive. Colors and descriptions are transcribed from the live
# objects via `get_label` — NOT invented — so applying this manifest is a
# no-op on every label's appearance; it only makes the manifest agree with
# reality. 13 of them carry GitHub's default grey (ededed) and an empty
# description because nothing ever styled them; declaring them here is what
# makes styling them a reviewable one-line change later, and that pass is
# deliberately NOT bundled into this inventory PR.
#
# ⛔ `priority:p0` is live, undeclared, and deliberately NOT declared here: its
# description makes it a dispatch queue-jump control rather than a spelling
# variant of the `prio:*` release axis, and `priority:p1`/`priority:p2` do not
# exist. Deciding what it is belongs to #1792, not to this file.
# ---------------------------------------------------------------------------

# --- pm state machine (the dispatch protocol; pm:queue / pm:dispatched above) ---
- name: "pm:blocked"
  color: "ededed"
  description: ""
- name: "pm:on-hold"
  color: "ededed"
  description: ""
- name: "pm:awaiting-maintainer"
  color: "ededed"
  description: ""
- name: "pm:blocking"
  color: "8250df"
  description: "Derived cache from the Blocked-by reverse index: open card with open dependents — never hand-set"
- name: "pm:epic"
  color: "5319e7"
  description: Parent delegated to a dedicated epic PM — other PMs never dispatch into its subtree
- name: "pm:retriage"
  color: "d4c5f9"
  description: Awaiting triage re-judgement — coexists with the standing pm:* label; queued cards skip dispatch
- name: "pm:seat"
  color: "ededed"
  description: ""

# --- triage (GitHub's default set, in use since repo creation) ---
- name: duplicate
  color: "cfd3d7"
  description: This issue or pull request already exists
- name: invalid
  color: "e4e669"
  description: This doesn't seem right
- name: question
  color: "d876e3"
  description: Further information is requested
- name: wontfix
  color: "ffffff"
  description: This will not be worked on
- name: good first issue
  color: "7057ff"
