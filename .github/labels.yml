# Label taxonomy — the single source of truth for this repository's labels.
#
# Governance (no ad-hoc labels):
#   - Every label this repo uses is declared here with a color and description.
#     Add or change a label by PR-ing this file; the `label-sync` workflow
#     applies the manifest when it lands on main (or via manual dispatch).
#   - `.github/labeler.yml` (the path-based PR labeler) may only reference
#     labels declared here — actions/labeler does not create labels.
#   - Sync is non-destructive (skip-delete): labels absent from this manifest
#     are left untouched. Retire a label by removing it here AND deleting it in
#     repo settings in the same change, so manifest and reality stay aligned.
#
# Taxonomy:
#   type        bug / enhancement / documentation / dependencies
#   area        metadata / backend / ci/cd / configuration
#   priority    priority:p0 — critical blocker; also the dispatch loop queue-jump
#               priority:p1 — required for production / M2
#               priority:p2 — important, M3
#               priority:p3 — lowest tier (no fleet description authored)
#   provenance  upstream:objectstack — blocked on / caused by the platform
#   workflow    needs-user-decision / skip-changeset
#   pm state    pm:queue / pm:dispatched / pm:blocked / pm:on-hold /
#               pm:awaiting-maintainer / pm:blocking / pm:epic / pm:retriage / pm:seat
#   triage      duplicate / invalid / question / wontfix /
#               good first issue / help wanted
#   routing     docs / i18n / testing / ui / upstream
#   lifecycle   finding / stale / post-preview / preview-1

# --- type ---
- name: bug
  color: "d73a4a"
  description: Something isn't working
- name: enhancement
  color: "a2eeef"
  description: New feature or request
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation
- name: dependencies
  color: "0366d6"
  description: Dependency bumps and lockfile changes

# --- area (mirrors .github/labeler.yml path rules) ---
- name: metadata
  color: "c5def5"
  description: Declarative metadata — schema, security posture, UI surfaces
- name: backend
  color: "c2e0c6"
  description: Server-side behaviour — hooks, flows, actions
- name: ci/cd
  color: "6e5494"
  description: CI plumbing and the verification pipeline
- name: configuration
  color: "bfd4f2"
  description: Build and app configuration files

# --- priority (the fleet axis; #1792 / decision batch #97 migrated prio:* onto it) ---
# ⚠️ #1792 ruled this description verbatim, appending the queue-jump sentence to
# the fleet wording. GitHub caps a label description at 100 characters and the
# ruled string is 133, so it CANNOT be stored — the API rejects it with 422
# "description is too long (maximum is 100 characters)", and `label-sync` would
# fail on it. Declared here is the ruling main clause (the fleet description,
# verbatim, 39 chars). The full ruled string, for the record and unabridged:
#   "Critical: blocker, must ship before MVP. Queue-jump: outranks batch and
#    breaks the round — never exempts claiming or same-file serial"
# ⇒ which storable form the seat wants is the open question on #1792; the
#   queue-jump semantics is protocol behaviour and lives in the PM protocol.
- name: "priority:p0"
  color: "b60205"
  description: "Critical: blocker, must ship before MVP"
- name: "priority:p1"
  color: "d93f0b"
  description: "High: required for production / M2"
- name: "priority:p2"
  color: "fbca04"
  description: "Medium: important, M3"
- name: "priority:p3"
  color: "ededed"
  description: ""

# --- provenance ---
- name: "upstream:objectstack"
  color: "5319e7"
  description: Blocked on / caused by the ObjectStack platform — tracked upstream

# --- workflow ---
- name: needs-user-decision
  color: "fbca04"
  description: Needs the maintainer's call before work proceeds
- name: "pm:queue"
  color: "0e8a16"
  description: Ready for the PM dispatch loop
- name: "pm:dispatched"
  color: "1d76db"
  description: Dispatched to a dev agent by /pm-dispatch
- name: skip-changeset
  color: "cccccc"
  description: PR ships nothing to users (pure CI/docs chore) — changeset gate waived

# ---------------------------------------------------------------------------
# Inventory catch-up (#1501). The 22 entries below already existed as live
# label objects but were undeclared, so `skip-delete: true` was the only thing
# keeping them alive. Colors and descriptions are transcribed from the live
# objects via `get_label` — NOT invented — so applying this manifest is a
# no-op on every label's appearance; it only makes the manifest agree with
# reality. 13 of them carry GitHub's default grey (ededed) and an empty
# description because nothing ever styled them; declaring them here is what
# makes styling them a reviewable one-line change later, and that pass is
# deliberately NOT bundled into this inventory PR.
#
# `priority:p0` was the one label that pass left undeclared, pending #1792. It is
# declared now, in the priority section above: decision batch #97 — recorded on
# #1792 and confirmed by the maintainer — ruled that its queue-jump wording IS the
# fleet p0 the dispatch loop reads, not a third concept, so hotcrm adopts the
# fleet axis `priority:p0..p3` and the `prio:*` spelling of that same axis was
# migrated card-by-card onto it and retired.
#
# ⛔ The three `prio:*` labels were DELETED, not merely undeclared — the one
# deliberate exception to `skip-delete` above, taken only after a read-back
# showed zero cards still carrying them. `priority:p1`, `priority:p2` and
# `priority:p3` are transcribed from the objectstack fleet labels; p3 carries the
# fleet default grey and an empty description because the fleet never authored
# one, and inventing one here was out of scope for the ruling.
# ---------------------------------------------------------------------------

# --- pm state machine (the dispatch protocol; pm:queue / pm:dispatched above) ---
- name: "pm:blocked"
  color: "ededed"
  description: ""
- name: "pm:on-hold"
