# Configuration for PR labeler
# Labels PRs based on changed files.
#
# Three invariants, each of which a revision of this file has broken:
#
#  1. Every glob must match something in the tree. `backend` pointed at
#     `src/server.ts`, `src/engine/**` and `src/triggers/**`; `ui` pointed at
#     `src/ui/**` and `tailwind.config.cjs`; `metadata` pointed at
#     `src/metadata/**`. None of those paths have ever existed in this repo.
#     `test/labeler-config.test.ts` now fails the suite on a glob that matches
#     no file. The same invariant runs repo-wide in
#     `test/config-glob-liveness.test.ts` (#1934), over vitest.config.ts, every
#     tsconfig and every workflow path filter — this file is the one it leaves
#     to the guard above, so a typo here produces one red, not two.
#
#  2. Every label key must already exist in the repository — `actions/labeler`
#     does not create them. The old `ui:` key had no matching repo label, so
#     even a corrected glob could not have applied it. The keys below are
#     exactly the six labels that exist today: documentation, dependencies,
#     ci/cd, backend, metadata, configuration. Adding a key here means creating
#     the label in repo settings first.
#
#  3. Every published documentation surface must be covered by a glob. The two
#     invariants above only ask whether each rule *does* something; neither can
#     see a whole documentation tree no rule points at. `content/docs/**` — the
#     published Fumadocs site, the largest doc surface in the repo — was in
#     exactly that state: a 48-file docs-only PR (#1921) came out of the labeler
#     with no label at all. `test/labeler-config.test.ts` now also checks the
#     reverse direction, against the content roots read out of
#     `apps/docs/source.config.ts`, so a new collection there fails the suite
#     until a glob below covers it.

# `content/{docs,blog}` are the doc site's two content roots (the `dir:` values
# in `apps/docs/source.config.ts`); they are listed one by one rather than as
# `content/**` so that a future content root has to be labelled deliberately.
documentation:
  - changed-files:
    - any-glob-to-any-file: ['content/docs/**', 'content/blog/**', 'docs/**', 'apps/docs/**', 'src/docs/**', '*.md', 'README*', 'CONTRIBUTING*']

dependencies:
  - changed-files:
    - any-glob-to-any-file: ['package.json', 'pnpm-lock.yaml', 'apps/docs/package.json', 'apps/docs/pnpm-lock.yaml']

# CI plumbing and the verification pipeline itself — workflows, helper scripts,
# and the test suites those workflows run.
ci/cd:
  - changed-files:
    - any-glob-to-any-file: ['.github/**', 'scripts/**', 'test/**', 'e2e/**']

# Server-side behaviour: hook handlers, automation flows, and invocable
# actions. This is the code that actually executes at request time.
#
# `src/*/…` since the ADR-0130 layout: a directory under `src/` is a package
# (`sales`, `service`, `revenue`, `marketing`) and each carries its own
# metadata-type subdirectories. `src/hooks/**` is gone rather than re-pointed —
# a `*.hook.ts` now sits beside the `*.object.ts` it names, which the last glob
# below already matches.
backend:
  - changed-files:
    - any-glob-to-any-file: ['src/*/actions/**', 'src/*/flows/**', 'src/*/objects/*.hook.ts']

# Declarative metadata: schema, the security posture layered on it, and the
# UI surfaces (apps, pages, views, dashboards, reports, datasets) that are
# themselves just metadata in ObjectStack.
metadata:
  - changed-files:
    - any-glob-to-any-file: ['src/*/objects/**', 'src/*/profiles/**', 'src/*/sharing/**', 'src/*/skills/**', 'src/*/data/**', 'src/*/apps/**', 'src/*/pages/**', 'src/*/views/**', 'src/*/interfaces/**', 'src/*/dashboards/**', 'src/*/reports/**', 'src/*/datasets/**', 'src/*/translations/**', 'objectstack.manifest.json']

configuration:
  - changed-files:
    - any-glob-to-any-file: ['*.config.ts', 'objectstack.config.ts', 'objectstack.composition.ts', 'tsconfig.json', '.gitignore', '.changeset/config.json']
