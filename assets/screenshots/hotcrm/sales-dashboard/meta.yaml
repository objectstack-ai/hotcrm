id: hotcrm-sales-dashboard
kind: screenshot
scope: hotcrm
category: analytics
status: published
captured: '2026-10-20'
capture:
  application: HotCRM
  platformVersion: '18.0.0'
  browserLocales:
    en: en-US
    zh-Hans: zh-CN
  dataset: 'shipped seed data + pnpm demo:staff, fresh database'
  theme: light
  viewport: 1408x964
  dashboard: sales_dashboard
  navigation: nav_sales_dashboard
# Browser locale per file, recorded because getting it wrong is exactly how the
# previous pair went bad: en.jpg was captured with a Chinese browser locale and
# published carrying a Simplified y-axis (38万 / 28.5万 / 19万 / 9.5万) under an
# otherwise fully English UI (#1800).
#
#   en.jpg       navigator.language = en-US
#   zh-Hans.jpg  navigator.language = zh-CN
#
# Both files are captured from a booted app on seeded demo data at the id route
# /_console/apps/app.objectstack.hotcrm/dashboard/sales_dashboard, in two fresh
# browser contexts that differ in nothing but that locale.
#
# ⚠️ The two files carry DIFFERENT y-axis labels on Monthly Revenue Trend, and
# on 18.0.0 that is CORRECT — do not "fix" either one. Measured on the pinned
# platform (18.0.0, #2205) with a DOM probe of the chart's tick labels rather
# than read off the picture:
#
#   en.jpg       0 / 200K / 400K / 600K / 800K
#   zh-Hans.jpg  0 / 20万 / 40万 / 60万 / 80万
#
#   this widget declares NO numeral format on this tree
#     src/sales/dashboards/sales.dashboard.ts -> monthly_revenue_trend.chartConfig
#     carries no yAxis.format
#     => it takes the locale-aware compact formatter, exactly as the executive
#        dashboard's revenue_trend does: the same probe run against that chart
#        renders the same two label sets under en-US and zh-CN.
#
# The previous pair (captured on 17.3.0) carried IDENTICAL grouped digits
# because the widget then declared `chartConfig.yAxis[0].format: '0,0'`. If a
# numeral format is ever declared on it again, this pair becomes identical once
# more and both files must be re-captured together.
locales:
  en: en.jpg
  zh-Hans: zh-Hans.jpg
title:
  en: Sales performance dashboard
  zh-Hans: 销售业绩仪表盘
alt:
  en: A sales dashboard with KPI cards, open pipeline value by stage, and the monthly revenue trend.
  zh-Hans: 包含 KPI 卡片、按阶段的进行中管道金额与月度收入趋势的销售仪表盘。
purpose:
  en: Show a unified analytical workspace for operating metrics and pipeline health.
  zh-Hans: 展示用于运营指标和销售管道健康度的统一分析工作区。
