name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Source hygiene (scripts/check-source-hygiene.mjs)
        run: node scripts/check-source-hygiene.mjs

      # The app's headline claim ("the whole CRM fits in one context window") is
      # a number, and an ungated number drifts — it already had. This prints the
      # layered measurement on every run and fails when the authored surface
      # grows past its committed, shrink-only ceiling (#1183). It lives here as
      # well as in Code Quality because this workflow has no `paths:` filter, so
      # it fires for every PR that can touch the tree it measures.
      - name: Source token ratchet (authored surface, only-down)
        run: node scripts/check-source-token-ratchet.mjs

      - name: Validate metadata (protocol/schema)
        run: pnpm run validate

      # `pnpm run lint` is `objectstack lint --strict` (#1581): an error OR a
      # warning fails this step, and suggestions stay advisory. Without the
      # flag only errors fail. `continue-on-error` was hiding exactly the
      # failures worth gating on.
      # It fails on every `i18n/missing-*` finding too, which is why the separate
      # i18n lint gate step was retired (#1585).
      - name: Lint metadata conventions
        run: pnpm run lint

      - name: TypeScript type checking
        run: pnpm run typecheck

      - name: Build project
        run: pnpm run build

      # `--coverage` so the thresholds in vitest.config.ts actually gate. They
      # are set just under the measured numbers for the hook handlers, which
      # went from 23% statements / 22% functions to 95% / 95% when the runtime
      # suites landed.
      - name: Run tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      
      - name: Upload build artifacts
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@v7
        with:
          name: build-output
          path: dist/
          retention-days: 7
