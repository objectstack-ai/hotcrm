apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hotcrm-app-hpa
  namespace: hotcrm
  labels:
    app.kubernetes.io/name: hotcrm
    app.kubernetes.io/component: app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hotcrm-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
