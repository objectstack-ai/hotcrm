name: Publish to marketplace (staging)

# Publishes HotCRM to the STAGING marketplace (https://cloud.objectos.app).
# Target URL is hard-coded; the credential is the staging-only org secret
# `OS_CLOUD_API_KEY_STAGING`. Production is a separate, manual-only workflow.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (print payloads, no HTTP)'
        type: boolean
        default: false
  # The TAG push, not the release object — and that distinction is the whole
  # point of #1908. This workflow declared `release: [published]` from the
  # start, and it never fired for a release `release.yml` produced: that job
  # creates the release with `softprops/action-gh-release` as `GITHUB_TOKEN`,
  # and GitHub raises no workflow-triggering event for anything `GITHUB_TOKEN`
  # does — the rule that stops workflows recursing. Of eleven runs in this
  # workflow's history exactly three carried `event=release`, and those three
  # are exactly the three releases a human created by hand in the web UI.
  # v2.1.0 was the cost: bot-created, no dispatch, never published at all,
  # because the dead declaration was what everyone read.
  #
  # A tag push comes from a maintainer's `git push`, so it is outside that rule
  # and cannot be silently swallowed. It is also the event `release.yml` itself
  # runs on, so the release and its staging publish now start together off one
  # push. ⛔ Do not "restore" the release trigger — `test/workflow-triggers.test.ts`
  # fails if any workflow declares one.
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: publish-marketplace-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish HotCRM → staging
    runs-on: ubuntu-latest
    if: github.repository == 'objectstack-ai/hotcrm'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Publish to STAGING marketplace
        env:
          OS_CLOUD_URL: https://cloud.objectos.app
          OS_CLOUD_API_KEY: ${{ secrets.OS_CLOUD_API_KEY_STAGING }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: pnpm publish:marketplace
