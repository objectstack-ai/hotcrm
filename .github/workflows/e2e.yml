name: E2E

# The playwright suite had never run in CI. Combined with a `baseURL` pointing
# at a port nothing served and specs that treated 401 as a pass, that meant the
# only tests exercising the real kernel — hooks firing against a real driver
# through the real REST API — were dead code.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts declares a `webServer` that runs
      # `pnpm build && objectstack start -p 4001` and waits on /api/v1/health,
      # so there is no separate server step here. The database starts empty and
      # the demo seed loads on first boot.
      - name: Run end-to-end tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
